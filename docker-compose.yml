services:
  db:
    image: postgres:16-alpine
    container_name: crm_b2b_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_b2b
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_b2b"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
